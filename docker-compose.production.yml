version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: stmarks_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./storage/app/public:/var/www/storage/app/public
    networks:
      - stmarks_network
    depends_on:
      - database
      - redis

  webserver:
    image: nginx:alpine
    container_name: stmarks_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/sites/:/etc/nginx/sites-available/
      - ./docker/nginx/ssl/:/etc/nginx/ssl/
    networks:
      - stmarks_network
    depends_on:
      - app

  database:
    image: mysql:8.0
    container_name: stmarks_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: stmarks_db
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - stmarks_network

  redis:
    image: redis:7-alpine
    container_name: stmarks_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - stmarks_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: stmarks_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: database
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    networks:
      - stmarks_network
    depends_on:
      - database

volumes:
  dbdata:
  redisdata:

networks:
  stmarks_network:
    driver: bridge
